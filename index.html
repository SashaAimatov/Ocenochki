
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оценки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        /* Custom styling for select to look decent in dark mode */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="pt-12 pb-4 px-4 sticky top-0 bg-black z-10 flex flex-col items-center relative">
        <h1 class="text-2xl font-semibold tracking-wide">Оценки</h1>
        <p id="headerDateRange" class="text-gray-400 text-sm mt-1">31 августа — 8 ноября</p>
        
        <!-- Settings Button -->
        <button id="settingsBtn" class="absolute right-4 top-12 text-gray-400 p-2 hover:text-white transition-colors cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main id="subjectsContainer" class="flex-1 overflow-y-auto px-4 pb-20 pt-2 space-y-3">
        <!-- Subjects injected via JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full flex justify-between items-center px-2 py-4 bg-[#1c1c1e] z-20 text-[11px] sm:text-xs text-gray-500 shadow-[0_-4px_10px_rgba(0,0,0,0.5)] border-t border-gray-900">
        <div class="flex-1 text-center truncate">Лента</div>
        <div class="flex-1 text-center truncate">Расписание</div>
        <div class="flex-1 text-center truncate">Задания</div>
        <div class="flex-1 text-center truncate text-[#ffb800] font-semibold">Оценки</div>
        <div class="flex-1 text-center truncate uppercase">АЛЕКСАН...</div>
    </nav>

    <!-- Table Modal -->
    <div id="tableModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[#1c1c1e] rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col shadow-2xl border border-gray-800">
            <div class="flex justify-between items-center p-5 border-b border-gray-800 shrink-0">
                <h2 id="tableModalTitle" class="text-xl font-semibold">Предмет</h2>
                <button id="closeTableModal" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            <div class="px-5 pt-4 pb-0 shrink-0">
                <div class="bg-[#2c2c2e] p-3.5 rounded-xl flex justify-between items-center border border-gray-700">
                    <span class="text-gray-400 text-sm font-medium">Средний балл</span>
                    <span id="tableModalAverage" class="text-xl font-bold text-white">4.50</span>
                </div>
            </div>
            <div class="p-5 overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-800 text-sm">
                            <th class="py-3 px-2 font-medium">Дата</th>
                            <th class="py-3 px-2 font-medium text-center">Оценка</th>
                            <th class="py-3 px-2 font-medium text-center">Вес</th>
                        </tr>
                    </thead>
                    <tbody id="tableModalBody" class="divide-y divide-gray-800 text-sm">
                        <!-- rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1c1c1e] rounded-2xl w-full max-w-md max-h-[90vh] h-[85vh] flex flex-col shadow-2xl border border-gray-800">
            <div class="flex justify-between items-center p-5 border-b border-gray-800 shrink-0">
                <h2 class="text-xl font-semibold">Настройки</h2>
                <button id="closeSettingsModal" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 flex flex-col gap-5">
                <!-- Period Setting -->
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Учебный период</label>
                    <input type="text" id="datePeriodInput" class="w-full bg-[#2c2c2e] text-white p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Subject Selection -->
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Выбор предмета</label>
                    <select id="subjectSelect" class="w-full bg-[#2c2c2e] text-white p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-blue-500">
                        <!-- Options injected via JS -->
                    </select>
                </div>

                <!-- Add Grade Form -->
                <div class="bg-[#2c2c2e] p-4 rounded-xl border border-gray-700">
                    <label class="block text-sm text-gray-300 font-medium mb-3">Добавить оценку</label>
                    <div class="flex gap-2 mb-3">
                        <div class="flex-1">
                            <input type="text" id="newGradeDate" placeholder="Дата (05.09)" class="w-full bg-[#1c1c1e] text-white p-2.5 rounded-lg border border-gray-600 focus:border-blue-500 focus:outline-none text-sm">
                        </div>
                        <div class="w-[70px]">
                            <input type="text" id="newGradeValue" placeholder="Оценка" class="w-full bg-[#1c1c1e] text-white p-2.5 rounded-lg border border-gray-600 focus:border-blue-500 focus:outline-none text-sm text-center">
                        </div>
                        <div class="w-[60px]">
                            <input type="number" id="newGradeWeight" placeholder="Вес" class="w-full bg-[#1c1c1e] text-white p-2.5 rounded-lg border border-gray-600 focus:border-blue-500 focus:outline-none text-sm text-center">
                        </div>
                    </div>
                    <button id="addGradeBtn" class="w-full bg-[#1A73E8] hover:bg-blue-600 text-white font-medium py-2 rounded-lg transition-colors text-sm">
                        Добавить
                    </button>
                </div>

                <!-- Existing Grades List -->
                <div class="flex-1 flex flex-col min-h-[150px]">
                    <label class="block text-sm text-gray-400 mb-2">Список оценок предмета</label>
                    <div id="settingsGradesList" class="flex-1 bg-[#2c2c2e] rounded-xl border border-gray-700 p-2 overflow-y-auto space-y-2">
                        <!-- Grade items injected via JS -->
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-gray-800 shrink-0">
                <button id="saveSettingsBtn" class="w-full bg-white text-black font-semibold py-3.5 rounded-xl transition-colors shadow-lg active:scale-[0.98]">
                    Готово
                </button>
            </div>
        </div>
    </div>

    <script>
        const defaultAppStruct = {
            datePeriod: "31 августа — 8 ноября",
            subjects: [
                { name: "Русский язык", grades: [{date: "01.09", val: "3", weight: "10"}, {date: "05.09", val: "3", weight: "10"}, {date: "08.09", val: "2", weight: ""}, {date: "12.09", val: "4", weight: "10"}, {date: "15.09", val: "3", weight: "10"}] },
                { name: "Физика", grades: [{date: "02.09", val: "4", weight: "7"}, {date: "06.09", val: "4", weight: "5"}, {date: "10.09", val: "5", weight: ""}] },
                { name: "Физкультура", grades: [{date: "01.09", val: "5", weight: ""}, {date: "05.09", val: "5", weight: ""}, {date: "12.09", val: "5", weight: ""}, {date: "18.09", val: "5", weight: ""}] },
                { name: "Химия", grades: [{date: "04.09", val: "5", weight: "5"}, {date: "11.09", val: "3", weight: ""}] },
                { name: "Вероятность и статистика", grades: [{date: "03.09", val: "3", weight: "5"}, {date: "10.09", val: "3", weight: "5"}] },
                { name: "География", grades: [{date: "05.09", val: "5", weight: ""}, {date: "12.09", val: "5", weight: ""}] },
                { name: "Геометрия", grades: [{date: "01.09", val: "3", weight: "7"}, {date: "04.09", val: "3", weight: "5"}] },
                { name: "Информатика", grades: [{date: "02.09", val: "5", weight: ""}, {date: "05.09", val: "4", weight: "5"}] },
                { name: "Алгебра", grades: [{date: "01.09", val: "4", weight: "8"}, {date: "03.09", val: "4", weight: ""}] },
                { name: "Англ. яз.", grades: [{date: "02.09", val: "4", weight: "5"}, {date: "07.09", val: "4", weight: "5"}] },
                { name: "Биология", grades: [{date: "05.09", val: "4", weight: ""}, {date: "19.09", val: "5", weight: ""}] },
                { name: "История", grades: [{date: "04.09", val: "5", weight: ""}, {date: "11.09", val: "3", weight: "5"}] },
                { name: "Литература", grades: [{date: "01.09", val: "2/3", weight: "10"}, {date: "04.09", val: "4", weight: ""}] },
                { name: "Обществознание", grades: [{date: "03.09", val: "4", weight: "7"}, {date: "10.09", val: "5", weight: "5"}] },
                { name: "Основы безопасности и защиты Родины", grades: [{date: "05.09", val: "5", weight: ""}] }
            ]
        };

        let appData = {};
        let currentSettingsSubjectIndex = 0;

        // DOM 
        const subjectsContainer = document.getElementById('subjectsContainer');
        const headerDateRange = document.getElementById('headerDateRange');
        
        // Settings Elements
        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsModal = document.getElementById('closeSettingsModal');
        const datePeriodInput = document.getElementById('datePeriodInput');
        const subjectSelect = document.getElementById('subjectSelect');
        const settingsGradesList = document.getElementById('settingsGradesList');
        const addGradeBtn = document.getElementById('addGradeBtn');
        const newGradeDate = document.getElementById('newGradeDate');
        const newGradeValue = document.getElementById('newGradeValue');
        const newGradeWeight = document.getElementById('newGradeWeight');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');

        // Table Elements
        const tableModal = document.getElementById('tableModal');
        const closeTableModalBtn = document.getElementById('closeTableModal');
        const tableModalTitle = document.getElementById('tableModalTitle');
        const tableModalAverage = document.getElementById('tableModalAverage');
        const tableModalBody = document.getElementById('tableModalBody');

        function loadData() {
            const savedData = localStorage.getItem('gradebookV3');
            if (savedData) {
                appData = JSON.parse(savedData);
            } else {
                appData = JSON.parse(JSON.stringify(defaultAppStruct));
            }
        }

        function saveData() {
            localStorage.setItem('gradebookV3', JSON.stringify(appData));
        }

        function renderMainView() {
            headerDateRange.textContent = appData.datePeriod;
            subjectsContainer.innerHTML = '';
            
            appData.subjects.forEach((subject, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-[#1c1c1e] rounded-2xl p-4 shadow-sm cursor-pointer active:scale-[0.98] transition-transform';
                card.onclick = () => openTableModal(idx);
                
                const header = document.createElement('div');
                header.className = 'flex items-center text-[15px] font-medium mb-3';
                header.innerHTML = `
                    <span>${subject.name}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                `;
                card.appendChild(header);

                const gradesDiv = document.createElement('div');
                gradesDiv.className = 'flex flex-wrap gap-2';

                subject.grades.forEach(grade => {
                    const box = document.createElement('div');
                    box.className = 'w-[42px] h-[42px] border border-gray-600/60 rounded-xl flex items-center justify-center relative font-medium text-lg bg-transparent';
                    box.textContent = grade.val;
                    
                    if (grade.weight) {
                        const badge = document.createElement('div');
                        badge.className = 'absolute -bottom-[6px] -right-[6px] bg-[#1A73E8] text-white text-[10px] w-[18px] h-[18px] rounded-full flex items-center justify-center font-bold';
                        badge.textContent = grade.weight;
                        box.appendChild(badge);
                    }
                    gradesDiv.appendChild(box);
                });
                
                card.appendChild(gradesDiv);
                subjectsContainer.appendChild(card);
            });
        }

        // Table Modal
        function openTableModal(subjectIndex) {
            const subject = appData.subjects[subjectIndex];
            tableModalTitle.textContent = subject.name;
            tableModalBody.innerHTML = '';
            
            // Рассчитываем средний балл с учетом веса
            let totalSum = 0;
            let totalWeight = 0;
            subject.grades.forEach(g => {
                // Извлекаем первое число из оценки (на случай формата "2/3")
                let valMatch = g.val.match(/[\d.]+/);
                if (valMatch) {
                    let val = parseFloat(valMatch[0]);
                    if (!isNaN(val)) {
                        // Если вес не указан, считаем его равным 1
                        let w = g.weight ? parseInt(g.weight) : 1; 
                        if (!isNaN(w) && w > 0) {
                            totalSum += val * w;
                            totalWeight += w;
                        }
                    }
                }
            });
            
            if (totalWeight > 0) {
                tableModalAverage.textContent = (totalSum / totalWeight).toFixed(2);
                tableModalAverage.className = "text-xl font-bold text-white";
            } else {
                tableModalAverage.textContent = '—';
                tableModalAverage.className = "text-xl font-bold text-gray-500";
            }
            
            if (subject.grades.length === 0) {
                tableModalBody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-gray-500">Нет оценок</td></tr>`;
            } else {
                subject.grades.forEach(grade => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-3 px-2 text-gray-300">${grade.date || '---'}</td>
                        <td class="py-3 px-2 text-center font-medium text-lg">${grade.val}</td>
                        <td class="py-3 px-2 text-center">
                            ${grade.weight ? `<span class="bg-[#1A73E8] text-white text-xs py-1 px-2 rounded-lg font-bold">${grade.weight}</span>` : '<span class="text-gray-600">-</span>'}
                        </td>
                    `;
                    tableModalBody.appendChild(tr);
                });
            }
            tableModal.classList.remove('hidden');
        }

        closeTableModalBtn.onclick = () => tableModal.classList.add('hidden');
        tableModal.onclick = (e) => { if(e.target === tableModal) tableModal.classList.add('hidden'); };

        // Settings Modal
        settingsBtn.onclick = () => {
            datePeriodInput.value = appData.datePeriod;
            
            // Populate select
            subjectSelect.innerHTML = '';
            appData.subjects.forEach((subj, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = subj.name;
                subjectSelect.appendChild(opt);
            });
            subjectSelect.value = currentSettingsSubjectIndex;
            
            renderSettingsGrades();
            settingsModal.classList.remove('hidden');
        };

        subjectSelect.onchange = (e) => {
            currentSettingsSubjectIndex = parseInt(e.target.value);
            renderSettingsGrades();
        };

        function renderSettingsGrades() {
            settingsGradesList.innerHTML = '';
            const subject = appData.subjects[currentSettingsSubjectIndex];
            
            if (subject.grades.length === 0) {
                settingsGradesList.innerHTML = `<div class="text-gray-500 text-sm p-3 text-center">Нет добавленных оценок</div>`;
                return;
            }

            subject.grades.forEach((grade, idx) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-[#1c1c1e] p-2.5 rounded-lg border border-gray-700';
                
                const info = document.createElement('div');
                info.className = 'text-sm flex gap-3 items-center';
                info.innerHTML = `
                    <span class="text-gray-400 w-[45px]">${grade.date || '--.--'}</span>
                    <span class="font-bold text-base w-[25px] text-center">${grade.val}</span>
                    <span class="text-xs text-blue-400 w-[30px]">${grade.weight ? `в:${grade.weight}` : ''}</span>
                `;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'text-red-500 hover:text-red-400 px-2 py-1 bg-red-500/10 rounded-md text-xs font-medium transition-colors';
                delBtn.textContent = 'Удалить';
                delBtn.onclick = () => deleteGrade(idx);

                item.appendChild(info);
                item.appendChild(delBtn);
                settingsGradesList.appendChild(item);
            });
        }

        addGradeBtn.onclick = () => {
            const dateVal = newGradeDate.value.trim();
            const gradeVal = newGradeValue.value.trim();
            const weightVal = newGradeWeight.value.trim();

            if (!gradeVal) {
                // Flash red if no grade
                newGradeValue.classList.add('border-red-500');
                setTimeout(() => newGradeValue.classList.remove('border-red-500'), 500);
                return;
            }

            appData.subjects[currentSettingsSubjectIndex].grades.push({
                date: dateVal,
                val: gradeVal,
                weight: weightVal
            });
            
            saveData();
            renderSettingsGrades();
            renderMainView(); // update background
            
            // clear inputs
            newGradeDate.value = '';
            newGradeValue.value = '';
            newGradeWeight.value = '';
        };

        function deleteGrade(gradeIndex) {
            appData.subjects[currentSettingsSubjectIndex].grades.splice(gradeIndex, 1);
            saveData();
            renderSettingsGrades();
            renderMainView();
        }

        closeSettingsModal.onclick = () => settingsModal.classList.add('hidden');
        settingsModal.onclick = (e) => { if(e.target === settingsModal) settingsModal.classList.add('hidden'); };

        saveSettingsBtn.onclick = () => {
            appData.datePeriod = datePeriodInput.value.trim();
            saveData();
            renderMainView();
            settingsModal.classList.add('hidden');
        };

        // Init
        loadData();
        renderMainView();
    </script>
</body>
</html>
```
