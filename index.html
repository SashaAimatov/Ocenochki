<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оценки</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 16px 16px 80px 16px;
      user-select: none;
    }

    /* Верхняя шапка */
    .header {
      position: relative;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header .period {
      font-size: 13px;
      color: #8e8e93;
    }

    .settings-btn {
      position: absolute;
      top: 2px;
      right: 4px;
      background: none;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      padding: 6px;
    }

    .settings-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Карточки предметов */
    .subject-card {
      background-color: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .subject-card:active {
      background-color: #242426;
    }

    .subject-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .subject-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subject-title .arrow {
      color: #636366;
      font-size: 14px;
    }

    /* Сетка оценок */
    .grades-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grade-badge {
      position: relative;
      width: 44px;
      height: 44px;
      background-color: #15171e;
      border: 1px solid #282f44;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .grade-badge:hover {
      border-color: #3e4a6d;
    }

    .grade-badge:active {
      transform: scale(0.92);
      border-color: #007aff;
    }

    .grade-weight {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 6px;
      min-width: 14px;
      text-align: center;
      pointer-events: none;
    }

    /* Нижняя навигация */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      background-color: #000000;
      border-top: 1px solid #1c1c1e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
    }

    .nav-item {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 500;
      cursor: default;
    }

    .nav-item.active {
      color: #ff9f0a;
      font-weight: 600;
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background-color: #1c1c1e;
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 32px 18px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.6);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    /* Таблица оценок */
    .avg-score-box {
      background-color: #2c2c2e;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .avg-score-val {
      font-size: 18px;
      font-weight: 700;
      color: #30d158;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .details-table th {
      text-align: left;
      padding: 8px 6px;
      color: #8e8e93;
      border-bottom: 1px solid #2c2c2e;
    }

    .details-table td {
      padding: 10px 6px;
      border-bottom: 1px solid #2c2c2e;
    }

    .table-grade-click {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #15171e;
      border: 1px solid #282f44;
      border-radius: 6px;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      font-weight: 600;
      color: #0a84ff;
    }

    /* Формы */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      width: 100%;
      background-color: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: #0a84ff;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background-color: #0a84ff;
      color: #ffffff;
    }

    .btn-danger {
      background-color: #ff453a;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #2c2c2e;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Оценки</h1>
    <div class="period" id="displayPeriod">31 августа — 8 ноября</div>
    <button class="settings-btn" id="openSettingsBtn" aria-label="Настройки">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <div id="subjectsContainer"></div>

  <div class="nav-bar">
    <div class="nav-item">Лента</div>
    <div class="nav-item">Расписание</div>
    <div class="nav-item">Задания</div>
    <div class="nav-item active">Оценки</div>
    <div class="nav-item">АЛЕКСАН...</div>
  </div>

  <!-- Модальное окно: Таблица оценок предмета -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 id="modalSubjectTitle">Предмет</h2>
        <button class="close-btn" id="closeDetailsModal">&times;</button>
      </div>
      <div class="avg-score-box">
        <span>Средневзвешенный балл:</span>
        <span class="avg-score-val" id="modalAvgScore">0.00</span>
      </div>
      <table class="details-table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Оценка</th>
            <th>Вес</th>
          </tr>
        </thead>
        <tbody id="detailsTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Модальное окно: Быстрое редактирование оценки -->
  <div class="modal-overlay" id="editGradeModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Изменить оценку</h2>
        <button class="close-btn" id="closeEditGradeModal">&times;</button>
      </div>
      <div class="form-group">
        <label>Дата</label>
        <input type="text" class="form-input" id="editGradeDate" placeholder="например: 12 окт">
      </div>
      <div class="form-group">
        <label>Оценка</label>
        <input type="text" class="form-input" id="editGradeVal" placeholder="например: 5 или 2/3">
      </div>
      <div class="form-group">
        <label>Вес (коэффициент)</label>
        <input type="number" class="form-input" id="editGradeWeight" placeholder="например: 5 или 10">
      </div>
      <div class="btn-row">
        <button class="btn btn-danger" id="deleteGradeBtn">Удалить</button>
        <button class="btn btn-primary" id="saveGradeBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно: Настройки -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button class="close-btn" id="closeSettingsModal">&times;</button>
      </div>
      <div class="form-group">
        <label>Период (в шапке)</label>
        <input type="text" class="form-input" id="settingPeriodInput">
      </div>
      <hr style="border: none; border-top: 1px solid #2c2c2e; margin: 16px 0;">
      <h3 style="font-size: 15px; margin-bottom: 12px;">Добавить новую оценку</h3>
      <div class="form-group">
        <label>Предмет</label>
        <select class="form-select" id="newGradeSubject"></select>
      </div>
      <div class="form-group">
        <label>Дата</label>
        <input type="text" class="form-input" id="newGradeDate" placeholder="например: 05 ноя">
      </div>
      <div class="form-group">
        <label>Оценка</label>
        <input type="text" class="form-input" id="newGradeVal" placeholder="например: 5 или 4/5">
      </div>
      <div class="form-group">
        <label>Вес</label>
        <input type="number" class="form-input" id="newGradeWeight" placeholder="например: 5 или 10">
      </div>
      <button class="btn btn-primary" id="addNewGradeBtn" style="width: 100%;">Добавить оценку</button>
    </div>
  </div>

  <script>
    const DEFAULT_DATA = {
      period: "31 августа — 8 ноября",
      subjects: [
        {
          name: "Русский язык",
          items: [
            { val: "3", weight: 0, date: "03 сен" },

          ]
        },
        {
          name: "Физика",
          items: [

          ]
        },
        {
          name: "Физкультура",
          items: [
            { val: "5", weight: 0, date: "05 сен" },
            { val: "5", weight: 0, date: "12 сен" },
            { val: "5", weight: 0, date: "19 сен" },
            { val: "5", weight: 0, date: "26 сен" },
            { val: "5", weight: 0, date: "03 окт" }
          ]
        },
        {
          name: "Химия",
          items: [
            { val: "5", weight: 5, date: "11 сен" },
            { val: "3", weight: 0, date: "18 сен" }
          ]
        },
        {
          name: "Вероятность и статистика",
          items: [
            { val: "3", weight: 5, date: "09 сен" },
            { val: "3", weight: 5, date: "16 сен" }
          ]
        },
        {
          name: "География",
          items: [
            { val: "5", weight: 0, date: "04 сен" },
            { val: "5", weight: 0, date: "18 сен" },
            { val: "5", weight: 5, date: "02 окт" }
          ]
        },
        {
          name: "Геометрия",
          items: [
            { val: "3", weight: 7, date: "06 сен" },
            { val: "3", weight: 5, date: "13 сен" },
            { val: "4", weight: 5, date: "20 сен" },
            { val: "3", weight: 3, date: "27 сен" },
            { val: "5", weight: 0, date: "04 окт" }
          ]
        },
        {
          name: "Информатика",
          items: [
            { val: "5", weight: 0, date: "07 сен" },
            { val: "4", weight: 5, date: "14 сен" },
            { val: "5", weight: 5, date: "21 сен" },
            { val: "5", weight: 3, date: "28 сен" },
            { val: "5", weight: 0, date: "05 окт" },
            { val: "5", weight: 0, date: "12 окт" },
            { val: "5", weight: 0, date: "19 окт" },
            { val: "5", weight: 0, date: "26 окт" },
            { val: "5", weight: 0, date: "02 ноя" }
          ]
        },
        {
          name: "Алгебра",
          items: [
            { val: "4", weight: 8, date: "05 сен" },
            { val: "4", weight: 0, date: "10 сен" },
            { val: "4", weight: 5, date: "17 сен" },
            { val: "5", weight: 5, date: "24 сен" },
            { val: "4", weight: 0, date: "01 окт" },
            { val: "4", weight: 10, date: "08 окт" },
            { val: "3", weight: 5, date: "15 окт" },
            { val: "3", weight: 5, date: "22 окт" }
          ]
        },
        {
          name: "Англ. яз.",
          items: [
            { val: "4", weight: 5, date: "09 сен" },
            { val: "4", weight: 5, date: "16 сен" },
            { val: "5", weight: 5, date: "23 сен" }
          ]
        },
        {
          name: "Биология",
          items: [
            { val: "4", weight: 0, date: "08 сен" },
            { val: "5", weight: 0, date: "22 сен" }
          ]
        },
        {
          name: "История",
          items: [
            { val: "5", weight: 0, date: "11 сен" },
            { val: "3", weight: 5, date: "18 сен" },
            { val: "4", weight: 5, date: "25 сен" },
            { val: "4", weight: 0, date: "02 окт" }
          ]
        },
        {
          name: "Литература",
          items: [
            { val: "2/3", weight: 10, date: "04 сен" },
            { val: "4", weight: 0, date: "11 сен" },
            { val: "5", weight: 0, date: "18 сен" },
            { val: "5", weight: 0, date: "25 сен" },
            { val: "5", weight: 0, date: "02 окт" },
            { val: "5", weight: 0, date: "09 окт" },
            { val: "4", weight: 0, date: "16 окт" },
            { val: "5", weight: 0, date: "23 окт" }
          ]
        },
        {
          name: "Обществознание",
          items: [
            { val: "4", weight: 7, date: "10 сен" },
            { val: "5", weight: 5, date: "17 сен" },
            { val: "3", weight: 0, date: "24 сен" },
            { val: "5", weight: 5, date: "01 окт" }
          ]
        },
        {
          name: "Основы безопасности и защиты Родины",
          items: [
            { val: "5", weight: 0, date: "15 сен" },
            { val: "5", weight: 0, date: "29 сен" },
            { val: "5", weight: 0, date: "13 окт" }
          ]
        }
      ]
    };

    let appData = loadData();
    let currentEdit = { subjectIndex: -1, gradeIndex: -1 };
    let currentOpenSubjectIndex = -1;

    function loadData() {
      const saved = localStorage.getItem("asg_grades_storage");
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return DEFAULT_DATA;
    }

    function saveData() {
      localStorage.setItem("asg_grades_storage", JSON.stringify(appData));
    }

    function parseNumericGrade(valStr) {
      if (!valStr) return null;
      if (String(valStr).includes("/")) {
        const parts = String(valStr).split("/");
        const num1 = parseFloat(parts[0]);
        const num2 = parseFloat(parts[1]);
        if (!isNaN(num1) && !isNaN(num2)) {
          return (num1 + num2) / 2;
        }
      }
      const num = parseFloat(valStr);
      return isNaN(num) ? null : num;
    }

    function calcWeightedAverage(items) {
      let totalWeighted = 0;
      let totalWeight = 0;
      let count = 0;

      items.forEach(it => {
        const gradeVal = parseNumericGrade(it.val);
        if (gradeVal !== null) {
          const w = (it.weight && it.weight > 0) ? it.weight : 1;
          totalWeighted += gradeVal * w;
          totalWeight += w;
          count++;
        }
      });

      if (totalWeight === 0 || count === 0) return "—";
      return (totalWeighted / totalWeight).toFixed(2);
    }

    function renderMainView() {
      document.getElementById("displayPeriod").textContent = appData.period;
      const container = document.getElementById("subjectsContainer");
      container.innerHTML = "";

      appData.subjects.forEach((subj, sIdx) => {
        const card = document.createElement("div");
        card.className = "subject-card";
        
        // Клик по карточке открывает таблицу предмета
        card.addEventListener("click", () => {
          openDetailsModal(sIdx);
        });

        const header = document.createElement("div");
        header.className = "subject-header";
        header.innerHTML = `
          <div class="subject-title">
            <span>${subj.name}</span>
            <span class="arrow">&gt;</span>
          </div>
        `;
        card.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "grades-grid";

        subj.items.forEach((item, gIdx) => {
          const badge = document.createElement("div");
          badge.className = "grade-badge";
          badge.textContent = item.val;

          if (item.weight && item.weight > 0) {
            const wBadge = document.createElement("span");
            wBadge.className = "grade-weight";
            wBadge.textContent = item.weight;
            badge.appendChild(wBadge);
          }

          // Изоляция клика: останавливаем всплытие, чтобы открывалось именно окно редактирования оценки
          badge.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditGradeModal(sIdx, gIdx);
          });

          grid.appendChild(badge);
        });

        card.appendChild(grid);
        container.appendChild(card);
      });
    }

    function openDetailsModal(sIdx) {
      currentOpenSubjectIndex = sIdx;
      const subj = appData.subjects[sIdx];
      document.getElementById("modalSubjectTitle").textContent = subj.name;
      document.getElementById("modalAvgScore").textContent = calcWeightedAverage(subj.items);

      const tbody = document.getElementById("detailsTableBody");
      tbody.innerHTML = "";

      subj.items.forEach((it, gIdx) => {
        const tr = document.createElement("tr");

        const tdDate = document.createElement("td");
        tdDate.textContent = it.date || "—";
        tr.appendChild(tdDate);

        const tdVal = document.createElement("td");
        const valBtn = document.createElement("div");
        valBtn.className = "table-grade-click";
        valBtn.t
