<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оценки</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 16px 16px 85px 16px;
      user-select: none;
    }

    /* Шапка */
    .header {
      position: relative;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header .period {
      font-size: 13px;
      color: #8e8e93;
    }

    .settings-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      padding: 8px;
    }

    .settings-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Плашки Статистика / Итоговые */
    .top-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-tab {
      background-color: #1c1c1e;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 500;
    }

    .top-tab-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    /* Карточка предмета */
    .subject-card {
      background-color: #1c1c1e;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .subject-card:active {
      background-color: #242426;
    }

    .subject-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .subject-header.has-grades {
      padding-bottom: 14px;
    }

    .subject-title {
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-title .arrow {
      color: #636366;
      font-weight: 400;
      font-size: 16px;
    }

    /* Сетка оценок */
    .grades-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Плашка оценки (только просмотр, никаких кнопок) */
    .grade-badge {
      position: relative;
      width: 46px;
      height: 46px;
      background-color: #161820;
      border: 1.5px solid #283044;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 500;
      color: #ffffff;
    }

    .grade-weight {
      position: absolute;
      bottom: -5px;
      right: -5px;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      min-width: 16px;
      text-align: center;
    }

    /* Нижнее меню */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      background-color: #000000;
      border-top: 1px solid #1c1c1e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 6px;
      z-index: 100;
    }

    .nav-item {
      font-size: 12px;
      color: #8e8e93;
      font-weight: 500;
    }

    .nav-item.active {
      color: #ff9f0a;
      font-weight: 600;
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background-color: #1c1c1e;
      width: 100%;
      max-width: 500px;
      border-radius: 22px 22px 0 0;
      padding: 20px 18px 34px 18px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: #2c2c2e;
      border: none;
      color: #8e8e93;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Средний балл и таблица */
    .avg-score-box {
      background-color: #2c2c2e;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .avg-score-val {
      font-size: 18px;
      font-weight: 700;
      color: #30d158;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .details-table th {
      text-align: left;
      padding: 10px 8px;
      color: #8e8e93;
      border-bottom: 1px solid #2c2c2e;
      font-weight: 500;
    }

    .details-table td {
      padding: 12px 8px;
      border-bottom: 1px solid #2c2c2e;
    }

    .table-grade-static {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #161820;
      border: 1px solid #283044;
      color: #ffffff;
      border-radius: 8px;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Поля ввода в настройках */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input, .form-select {
      width: 100%;
      background-color: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: #0a84ff;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .btn-primary {
      background-color: #0a84ff;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #2c2c2e;
      color: #ff453a;
      margin-top: 16px;
    }

    /* Список оценок внутри настроек для тихого редактирования/удаления */
    .settings-grades-list {
      margin-top: 16px;
      border-top: 1px solid #2c2c2e;
      padding-top: 12px;
    }

    .settings-grade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2c2c2e;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .settings-grade-actions {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      border: none;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-edit {
      background: #0a84ff;
      color: #fff;
    }

    .mini-del {
      background: #ff453a;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Оценки</h1>
    <div class="period" id="displayPeriod">31 августа — 8 ноября</div>
    <button class="settings-btn" onclick="openSettingsModal()" aria-label="Настройки">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <div class="top-tabs">
    <div class="top-tab">
      <div class="top-tab-icon" style="color: #bf5af2; border: 1.5px solid #bf5af2;">◔</div>
      <span>Статистика</span>
    </div>
    <div class="top-tab">
      <div class="top-tab-icon" style="color: #0a84ff; border: 1.5px solid #0a84ff;">✓</div>
      <span>Итоговые</span>
    </div>
  </div>

  <div id="subjectsContainer"></div>

  <div class="nav-bar">
    <div class="nav-item">Лента</div>
    <div class="nav-item">Расписание</div>
    <div class="nav-item">Задания</div>
    <div class="nav-item active">Оценки</div>
    <div class="nav-item">АЛЕКСАН...</div>
  </div>

  <!-- Окно просмотра таблицы оценок по предмету (без намеков на редактирование) -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 id="modalSubjectTitle">Предмет</h2>
        <button class="close-btn" onclick="closeModal('detailsModal')">&times;</button>
      </div>
      <div class="avg-score-box">
        <span>Средний балл:</span>
        <span class="avg-score-val" id="modalAvgScore">—</span>
      </div>
      <div id="tableWrapper">
        <table class="details-table" id="detailsTable">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Оценка</th>
              <th>Вес</th>
            </tr>
          </thead>
          <tbody id="detailsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Окно настроек (через шестеренку) -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button class="close-btn" onclick="closeModal('settingsModal')">&times;</button>
      </div>
      <div class="form-group">
        <label>Период</label>
        <input type="text" class="form-input" id="settingPeriodInput" oninput="updatePeriod(this.value)">
      </div>
      <hr style="border: none; border-top: 1px solid #2c2c2e; margin: 16px 0;">
      <div class="form-group">
        <label>Предмет</label>
        <select class="form-select" id="newGradeSubject" onchange="renderSettingsGradesList()"></select>
      </div>
      <div class="form-group">
        <label id="gradeFormTitle">Оценка</label>
        <input type="text" class="form-input" id="newGradeVal" placeholder="Например: 5">
      </div>
      <div class="form-group">
        <label>Вес (индекс в синем кружке)</label>
        <input type="number" class="form-input" id="newGradeWeight" placeholder="Например: 5 или 10 (необязательно)">
      </div>
      <div class="form-group">
        <label>Дата</label>
        <input type="text" class="form-input" id="newGradeDate" placeholder="Например: 25 окт">
      </div>
      <button class="btn btn-primary" id="saveGradeSettingsBtn" onclick="saveGradeFromSettings()">Добавить</button>

      <!-- Список уже выставленных оценок выбранного предмета (виден только тут в шестеренке) -->
      <div class="settings-grades-list" id="settingsGradesList"></div>

      <button class="btn btn-secondary" onclick="clearAllGrades()">Очистить все предметы</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "aimatov_grades_stealth_v5";

    const EMPTY_STATE = {
      period: "31 августа — 8 ноября",
      subjects: [
        { name: "Алгебра", items: [] },
        { name: "Англ. яз.", items: [] },
        { name: "Биология", items: [] },
        { name: "Вероятность и статистика", items: [] },
        { name: "География", items: [] },
        { name: "Геометрия", items: [] },
        { name: "Информатика", items: [] },
        { name: "История", items: [] },
        { name: "Литература", items: [] },
        { name: "Обществознание", items: [] },
        { name: "Основы безопасности и защиты Родины", items: [] },
        { name: "Русский язык", items: [] },
        { name: "Физика", items: [] },
        { name: "Физкультура", items: [] },
        { name: "Химия", items: [] }
      ]
    };

    let state = loadState();
    let editingIndexInSettings = -1;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(EMPTY_STATE));
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function parseScore(valStr) {
      if (!valStr) return null;
      const str = String(valStr).trim();
      if (str.includes("/")) {
        const parts = str.split("/");
        const a = parseFloat(parts[0]);
        const b = parseFloat(parts[1]);
        if (!isNaN(a) && !isNaN(b)) return (a + b) / 2;
      }
      const num = parseFloat(str);
      return isNaN(num) ? null : num;
    }

    function getWeightedAverage(items) {
      let sum = 0;
      let totalWeight = 0;
      items.forEach(item => {
        const score = parseScore(item.val);
        if (score !== null) {
          const w = (item.weight && item.weight > 0) ? Number(item.weight) : 1;
          sum += score * w;
          totalWeight += w;
        }
      });
      return totalWeight > 0 ? (sum / totalWeight).toFixed(2) : "—";
    }

    function render() {
      document.getElementById("displayPeriod").textContent = state.period;
      const container = document.getElementById("subjectsContainer");
      container.innerHTML = "";

      state.subjects.forEach((subj, sIdx) => {
        const card = document.createElement("div");
        card.className = "subject-card";
        card.onclick = function() {
          openSubjectTable(sIdx);
        };

        const header = document.createElement("div");
        header.className = "subject-header" + (subj.items.length > 0 ? " has-grades" : "");
        header.innerHTML = `
          <div class="subject-title">
            <span>${subj.name}</span>
            <span class="arrow">&gt;</span>
          </div>
        `;
        card.appendChild(header);

        if (subj.items.length > 0) {
          const grid = document.createElement("div");
          grid.className = "grades-grid";

          subj.items.forEach((item) => {
            const badge = document.createElement("div");
            badge.className = "grade-badge";
            badge.textContent = item.val;

            if (item.weight && Number(item.weight) > 0) {
              const wSpan = document.createElement("span");
              wSpan.className = "grade-weight";
              wSpan.textContent = item.weight;
              badge.appendChild(wSpan);
            }

            grid.appendChild(badge);
          });

          card.appendChild(grid);
        }

        container.appendChild(card);
      });
    }

    function openSubjectTable(sIdx) {
      const subj = state.subjects[sIdx];
      document.getElementById("modalSubjectTitle").textContent = subj.name;
      document.getElementById("modalAvgScore").textContent = getWeightedAverage(subj.items);

      const tbody = document.getElementById("detailsTableBody");
      tbody.innerHTML = "";

      subj.items.forEach((item) => {
        const tr = document.createElement("tr");

        const tdDate = document.createElement("td");
        tdDate.textContent = item.date || "—";
        tr.appendChild(tdDate);

        const tdVal = document.createElement("td");
        const staticBadge = document.createElement("div");
        staticBadge.className = "table-grade-static";
        staticBadge.textContent = item.val;
        tdVal.appendChild(staticBadge);
        tr.appendChild(tdVal);

        const tdWeight = document.createElement("td");
        tdWeight.textContent = (item.weight && item.weight > 0) ? item.weight : "1";
        tr.appendChild(tdWeight);

        tbody.appendChild(tr);
      });

      document.getElementById("detailsModal").classList.add("open");
    }

    function openSettingsModal() {
      document.getElementById("settingPeriodInput").value = state.period;
      const select = document.getElementById("newGradeSubject");
      const prevSelected = select.value;
      select.innerHTML = "";
      state.subjects.forEach((subj, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = subj.name;
        select.appendChild(opt);
      });
      if (prevSelected !== "") select.value = prevSelected;

      resetSettingsForm();
      renderSettingsGradesList();
      document.getElementById("settingsModal").classList.add("open");
    }

    function resetSettingsForm() {
      editingIndexInSettings = -1;
      document.getElementById("newGradeVal").value = "";
      document.getElementById("newGradeWeight").value = "";
      document.getElementById("newGradeDate").value = "";
      document.getElementById("saveGradeSettingsBtn").textContent = "Добавить";
    }

    function renderSettingsGradesList() {
      const sIdx = parseInt(document.getElementById("newGradeSubject").value, 10);
      const listContainer = document.getElementById("settingsGradesList");
      listContainer.innerHTML = "";

      if (isNaN(sIdx)) return;
      const items = state.subjects[sIdx].items;

      items.forEach((item, gIdx) => {
        const row = document.createElement("div");
        row.className = "settings-grade-item";

        const info = document.createElement("span");
        const wText = (item.weight && item.weight > 0) ? ` (вес ${item.weight})` : "";
        info.textContent = `Оценка: ${item.val}${wText} — ${item.date || "без даты"}`;
        row.appendChild(info);

        const actions = document.createElement("div");
        actions.className = "settings-grade-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "mini-btn mini-edit";
        editBtn.textContent = "Изм.";
        editBtn.onclick = function() {
          editingIndexInSettings = gIdx;
          document.getElementById("newGradeVal").value = item.val;
          document.getElementById("newGradeWeight").value = (item.weight && item.weight > 0) ? item.weight : "";
          document.getElementById("newGradeDate").value = item.date === "—" ? "" : (item.date || "");
          document.getElementById("saveGradeSettingsBtn").textContent = "Сохранить изменения";
        };

        const delBtn = document.createElement("button");
        delBtn.className = "mini-btn mini-del";
        delBtn.textContent = "×";
        delBtn.onclick = function() {
          state.subjects[sIdx].items.splice(gIdx, 1);
          saveState();
          render();
          resetSettingsForm();
          renderSettingsGradesList();
        };

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);
        listContainer.appendChild(row);
      });
    }

    function updatePeriod(val) {
      state.period = val;
      saveState();
      document.getElementById("displayPeriod").textContent = val;
    }

    function saveGradeFromSettings() {
      const sIdx = parseInt(document.getElementById("newGradeSubject").value, 10);
      const val = document.getElementById("newGradeVal").value.trim();
      const weightRaw = document.getElementById("newGradeWeight").value.trim();
      const date = document.getElementById("newGradeDate").value.trim();

      if (!val) return;

      const weight = weightRaw ? parseInt(weightRaw, 10) : 0;
      const newObj = {
        val,
        weight: isNaN(weight) ? 0 : weight,
        date: date || "—"
      };

      if (editingIndexInSettings === -1) {
        state.subjects[sIdx].items.push(newObj);
      } else {
        state.subjects[sIdx].items[editingIndexInSettings] = newObj;
      }

      saveState();
      render();
      resetSettingsForm();
      renderSettingsGradesList();
    }

    function clearAllGrades() {
      if (confirm("Очистить все данные?")) {
        state.subjects.forEach(s => s.items = []);
        saveState();
        render();
        resetSettingsForm();
        renderSettingsGradesList();
        closeModal("settingsModal");
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    document.querySelectorAll(".modal-overlay").forEach(overlay => {
      overlay.addEventListener("click", function(e) {
        if (e.target === overlay) {
          overlay.classList.remove("open");
        }
      });
    });

    render();
  </script>
</body>
</html>
